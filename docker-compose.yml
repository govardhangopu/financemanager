services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD:  ${DB_PASS:?Set MYSQL_ROOT_PASSWORD in the root .env file}
      MYSQL_DATABASE: financemanager
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/config/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\" --silent && mysql -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" -D financemanager -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      MYSQLHOST: db
      MYSQLPORT: 3306
      MYSQLDATABASE: financemanager
    ports: 
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  mysql_data: